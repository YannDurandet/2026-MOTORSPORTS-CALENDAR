name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm run build

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # IndexNow: tell Bing and the other participating engines which pages
      # changed. Runs after the deploy so the key file and pages are live when
      # they fetch them. The cache carries the page hashes between runs so only
      # new or changed pages are sent (a cold cache sends everything). Needs no
      # secret, and a failure here never fails the deploy.
      - uses: actions/cache@v4
        with:
          path: .indexnow-hashes.json
          key: indexnow-${{ github.run_id }}
          restore-keys: indexnow-

      - name: Submit new and changed pages to IndexNow
        continue-on-error: true
        run: npm run indexnow
